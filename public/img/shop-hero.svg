<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 130 1200 540" width="1200" height="540" role="img" aria-label="">
    <!--
        Apertura dello shop: vale per tutto il marketplace, non per una singola
        azienda. Solo forme e colori del marchio, nessuna fotografia.
    -->
    <defs>
        <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0B4662"/>
            <stop offset=".55" stop-color="#15566F"/>
            <stop offset="1" stop-color="#1E6E7A"/>
        </linearGradient>
        <linearGradient id="verde" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6FBF45"/>
            <stop offset="1" stop-color="#428B23"/>
        </linearGradient>
        <linearGradient id="chiaro" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity=".96"/>
            <stop offset="1" stop-color="#DCE9F0" stop-opacity=".9"/>
        </linearGradient>
    </defs>

    <rect x="0" y="0" width="1200" height="800" fill="url(#fondo)"/>

    <!-- Fasce diagonali della testata, appena accennate. -->
    <g fill="#FFFFFF" opacity=".05">
        <rect x="-200" y="-340" width="150" height="1500" transform="rotate(28 0 0)"/>
        <rect x="120" y="-340" width="70" height="1500" transform="rotate(28 0 0)"/>
        <rect x="430" y="-340" width="220" height="1500" transform="rotate(28 0 0)"/>
    </g>

    <circle cx="905" cy="300" r="290" fill="#FFFFFF" opacity=".05"/>

    <!-- Banco del mercato: tre casse impilate, una borsa, un cartellino. -->
    <g transform="translate(600 150)">
        <!-- Cassa grande -->
        <g transform="translate(60 250)">
            <rect x="0" y="0" width="260" height="200" rx="14" fill="url(#chiaro)"/>
            <path d="M0 62h260" stroke="#0B4662" stroke-opacity=".12" stroke-width="10"/>
            <rect x="108" y="0" width="44" height="62" fill="#51A52C" opacity=".9"/>
            <rect x="108" y="62" width="44" height="138" fill="#51A52C" opacity=".35"/>
        </g>

        <!-- Cassa piccola inclinata -->
        <g transform="translate(330 300) rotate(-8)">
            <rect x="0" y="0" width="170" height="150" rx="12" fill="#EAF5E4" opacity=".92"/>
            <path d="M0 48h170" stroke="#0B4662" stroke-opacity=".12" stroke-width="8"/>
            <rect x="70" y="0" width="30" height="48" fill="#428B23" opacity=".85"/>
        </g>

        <!-- Borsa della spesa -->
        <g transform="translate(-20 60)">
            <path d="M40 90h220a18 18 0 0 1 18 20l-22 220a26 26 0 0 1-26 23H70a26 26 0 0 1-26-23L22 110a18 18 0 0 1 18-20Z" fill="url(#verde)"/>
            <path d="M100 100V74a50 50 0 0 1 100 0v26" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="14" stroke-linecap="round"/>
            <circle cx="150" cy="210" r="46" fill="#FFFFFF" opacity=".25"/>
            <path d="M128 210l16 16 30-32" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Cartellino del prezzo -->
        <g transform="translate(300 40) rotate(12)">
            <path d="M8 0h104a8 8 0 0 1 5.7 2.3l86 86a8 8 0 0 1 0 11.4l-100 100a8 8 0 0 1-11.4 0l-86-86A8 8 0 0 1 0 108V8a8 8 0 0 1 8-8Z" fill="#FFFFFF" opacity=".92"/>
            <circle cx="46" cy="46" r="16" fill="#0B4662" opacity=".55"/>
        </g>

        <!-- Moneta KMoney -->
        <g transform="translate(430 170)">
            <circle cx="0" cy="0" r="54" fill="#6FBF45"/>
            <circle cx="0" cy="0" r="54" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="6"/>
            <path d="M-14-26v52M-14 2l26-28M-14 2l28 24" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
    </g>

    <!-- Piano d'appoggio -->
    <rect x="560" y="628" width="640" height="14" rx="7" fill="#FFFFFF" opacity=".18"/>
</svg>
